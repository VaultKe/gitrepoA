<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium VaultKe Logo - Realistic Vault Design -->
  <defs>
    <!-- Ultra-Premium Metallic Gradients -->
    <radialGradient id="vaultSteelGradient" cx="40%" cy="25%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#CBD5E1;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#94A3B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="vaultRimGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="goldLockGradient" cx="25%" cy="25%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>

    <!-- Advanced Filters for Realism -->
    <filter id="premiumShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="metalTexture" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComposite in="SourceGraphic" in2="noise" operator="multiply"/>
    </filter>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Vault Frame -->
  <circle cx="60" cy="60" r="58" fill="url(#vaultRimGradient)" filter="url(#premiumShadow)"/>

  <!-- Main Vault Door -->
  <circle cx="60" cy="60" r="48" fill="url(#vaultSteelGradient)" stroke="#334155" stroke-width="2" filter="url(#metalTexture)"/>

  <!-- Vault Door Security Bolts -->
  <g fill="#0F172A" stroke="#64748B" stroke-width="1">
    <circle cx="30" cy="30" r="3"/>
    <circle cx="90" cy="30" r="3"/>
    <circle cx="30" cy="90" r="3"/>
    <circle cx="90" cy="90" r="3"/>
    <circle cx="60" cy="20" r="2.5"/>
    <circle cx="60" cy="100" r="2.5"/>
    <circle cx="20" cy="60" r="2.5"/>
    <circle cx="100" cy="60" r="2.5"/>
  </g>

  <!-- Concentric Security Rings -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#475569" stroke-width="1" opacity="0.6"/>
  <circle cx="60" cy="60" r="32" fill="none" stroke="#64748B" stroke-width="1.5" opacity="0.8"/>
  <circle cx="60" cy="60" r="26" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Premium Combination Lock Mechanism -->
  <circle cx="60" cy="60" r="20" fill="url(#goldLockGradient)" stroke="#92400E" stroke-width="2" filter="url(#goldGlow)"/>

  <!-- Lock Mechanism Rings -->
  <g stroke="#B45309" stroke-width="1" fill="none">
    <circle cx="60" cy="60" r="16"/>
    <circle cx="60" cy="60" r="12"/>
    <circle cx="60" cy="60" r="8"/>
  </g>

  <!-- Combination Dial Markers -->
  <g stroke="#92400E" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="44" x2="60" y2="48" />
    <line x1="76" y1="60" x2="72" y2="60" />
    <line x1="60" y1="76" x2="60" y2="72" />
    <line x1="44" y1="60" x2="48" y2="60" />
    <line x1="71.3" y1="48.7" x2="68.7" y2="51.3" />
    <line x1="71.3" y1="71.3" x2="68.7" y2="68.7" />
    <line x1="48.7" y1="71.3" x2="51.3" y2="68.7" />
    <line x1="48.7" y1="48.7" x2="51.3" y2="51.3" />
  </g>

  <!-- Central Handle/Dial -->
  <circle cx="60" cy="60" r="6" fill="#FCD34D" stroke="#92400E" stroke-width="1"/>
  <circle cx="60" cy="60" r="3" fill="#FEF3C7"/>
  <rect x="58" y="57" width="4" height="6" fill="#92400E" rx="1"/>

  <!-- Vault Locking Spokes -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="26" x2="60" y2="34" />
    <line x1="60" y1="86" x2="60" y2="94" />
    <line x1="94" y1="60" x2="86" y2="60" />
    <line x1="26" y1="60" x2="34" y2="60" />
    <line x1="81.2" y1="38.8" x2="75.8" y2="44.2" />
    <line x1="38.8" y1="81.2" x2="44.2" y2="75.8" />
    <line x1="81.2" y1="81.2" x2="75.8" y2="75.8" />
    <line x1="38.8" y1="38.8" x2="44.2" y2="44.2" />
  </g>

  <!-- Brand Elements -->
  <g opacity="0.9">
    <rect x="15" y="105" width="30" height="2" fill="url(#brandGradient)" rx="1"/>
    <text x="85" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#brandGradient)">Ke</text>
  </g>

  <!-- Security Status Indicators -->
  <g fill="#10B981" opacity="0.8">
    <circle cx="25" cy="25" r="1.5"/>
    <circle cx="95" cy="95" r="1.5"/>
  </g>
</svg>
