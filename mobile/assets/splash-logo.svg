<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium VaultKe Splash Screen Logo -->
  <defs>
    <radialGradient id="splashVaultGradient" cx="40%" cy="25%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#94A3B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="splashGoldGradient" cx="25%" cy="25%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="splashTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1F5F9;stop-opacity:0.95" />
    </linearGradient>

    <linearGradient id="splashBrandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>

    <filter id="splashShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="splashGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium Vault Door -->
  <circle cx="100" cy="100" r="75" fill="url(#splashVaultGradient)" stroke="#334155" stroke-width="3" filter="url(#splashShadow)"/>

  <!-- Security Rings -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#475569" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#64748B" stroke-width="2.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Central Lock Mechanism -->
  <circle cx="100" cy="100" r="22" fill="url(#splashGoldGradient)" stroke="#92400E" stroke-width="2" filter="url(#splashGlow)"/>

  <!-- Combination Dial Markers -->
  <g stroke="#92400E" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="82" x2="100" y2="86" />
    <line x1="118" y1="100" x2="114" y2="100" />
    <line x1="100" y1="118" x2="100" y2="114" />
    <line x1="82" y1="100" x2="86" y2="100" />
    <line x1="113" y1="87" x2="110" y2="90" />
    <line x1="113" y1="113" x2="110" y2="110" />
    <line x1="87" y1="113" x2="90" y2="110" />
    <line x1="87" y1="87" x2="90" y2="90" />
  </g>

  <!-- Central Handle -->
  <circle cx="100" cy="100" r="8" fill="#FCD34D" stroke="#92400E" stroke-width="1"/>
  <circle cx="100" cy="100" r="4" fill="#FEF3C7"/>
  <rect x="98" y="96" width="4" height="8" fill="#92400E" rx="1"/>

  <!-- Vault Locking Spokes -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="100" y1="35" x2="100" y2="50" />
    <line x1="100" y1="150" x2="100" y2="165" />
    <line x1="165" y1="100" x2="150" y2="100" />
    <line x1="35" y1="100" x2="50" y2="100" />
    <line x1="142" y1="58" x2="132" y2="68" />
    <line x1="58" y1="142" x2="68" y2="132" />
    <line x1="142" y1="142" x2="132" y2="132" />
    <line x1="58" y1="58" x2="68" y2="68" />
  </g>

  <!-- Premium VaultKe Typography -->
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#splashTextGradient)" filter="url(#splashShadow)">Vault</text>
  <text x="330" y="85" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#splashBrandGradient)" filter="url(#splashShadow)">Ke</text>

  <!-- Professional Tagline -->
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#CBD5E1">Secure • Smart • African Financial Platform</text>

  <!-- Security Indicators -->
  <g fill="#10B981" opacity="0.8">
    <circle cx="180" cy="50" r="2"/>
    <circle cx="370" cy="130" r="2"/>
  </g>

  <!-- Premium Brand Accent -->
  <rect x="200" y="150" width="180" height="6" fill="url(#splashBrandGradient)" rx="3"/>

  <!-- Vault Security Badge -->
  <g opacity="0.7">
    <rect x="320" y="140" width="60" height="20" fill="#1E293B" rx="10" stroke="url(#splashBrandGradient)" stroke-width="1"/>
    <text x="350" y="153" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="url(#splashBrandGradient)" text-anchor="middle">SECURED</text>
  </g>
</svg>
