# TURN server configuration for coturn
# This file should be mounted to /etc/turnserver.conf in the coturn container

# Listener ports
listening-port=3478
tls-listening-port=5349

# External IP (replace with your server's public IP)
external-ip=YOUR_PUBLIC_IP

# Relay ports
min-port=49152
max-port=65535

# Authentication
use-auth-secret
static-auth-secret=vaultke-turn-secret
realm=vaultke

# TLS configuration (optional, for production)
# cert=/etc/letsencrypt/live/your-domain/fullchain.pem
# pkey=/etc/letsencrypt/live/your-domain/privkey.pem

# Logging
log-file=/var/log/turnserver.log
simple-log

# Performance tuning
max-bps=10000000
total-quota=100
bps-capacity=0

# Security
no-tcp-relay
udp-self-balance

# Keepalive
verbose
