version: '3.8'
services:
  chat-service:
    build: .
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped